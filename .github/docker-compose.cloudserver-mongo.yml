services:
  mongodb:
    image: mongo:5.0
    platform: linux/amd64
    command: --replSet rs0 --port 27018 --bind_ip_all
    ports:
      - "27018:27018"
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --port 27018 --quiet
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  mongo-init:
    image: mongo:5.0
    platform: linux/amd64
    depends_on:
      mongodb:
        condition: service_healthy
    command: >
      mongosh --host mongodb:27018 --eval
      'rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongodb:27018"}]})'
    restart: "no"

  cloudserver:
    image: ghcr.io/scality/cloudserver:9.3.0-preview.1
    platform: linux/amd64
    ports:
      - "8000:8000"
    environment:
      - S3VAULT=mem
      - S3METADATA=mongodb
      - S3DATA=mem
      - MONGODB_HOSTS=mongodb:27018
      - MONGODB_RS=rs0
      - REMOTE_MANAGEMENT_DISABLE=true
      - LOG_LEVEL=info
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 5s
      timeout: 5s
      retries: 12
